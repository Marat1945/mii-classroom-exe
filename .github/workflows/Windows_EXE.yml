name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"                      # українські написи в журналі: інакше Windows-консоль (cp1252) ламає Python
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python on GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "python-docx>=1.1.2,<2" "google-api-python-client>=2.150,<3" "google-auth-oauthlib>=1.2,<2" "google-auth-httplib2>=0.2,<1" "openai>=1.90,<3" "keyring>=25,<27" "Pillow>=10.4,<13" "tkinterdnd2>=0.4.2,<1"
          python -m pip install pyinstaller

      - name: Verify that every library is installed
        shell: python
        run: |
          import importlib.util, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          required = {"docx": "python-docx", "googleapiclient": "google-api-python-client",
                      "google_auth_oauthlib": "google-auth-oauthlib", "google_auth_httplib2": "google-auth-httplib2",
                      "openai": "openai", "keyring": "keyring", "PIL": "Pillow", "tkinterdnd2": "tkinterdnd2"}
          missing = [package for module, package in required.items() if importlib.util.find_spec(module) is None]
          if missing:
              print("НЕ ВСТАНОВЛЕНО:", ", ".join(missing))
              sys.exit(1)
          print("Усі бібліотеки на місці:", ", ".join(required.values()))

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon "app_icon.ico" --name Pomichnyk_Uchytelia --add-data "data;data" --add-data "КТП джерела;КТП джерела" "Запустити Windows EXE.py"

      - name: Smoke test the EXE (it must start and see every library)
        shell: pwsh
        continue-on-error: true            # поки перевірку не підтверджено на Windows, вона лише ПОПЕРЕДЖАЄ (червоний рядок), а не зупиняє збірку
        run: |
          $report = Join-Path $PWD "selftest.txt"
          if (Test-Path $report) { Remove-Item $report }
          $exe = Join-Path $PWD "dist/Pomichnyk_Uchytelia.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "`"$report`"") -Wait -PassThru
          if (Test-Path $report) { Get-Content $report -Encoding UTF8 } else { Write-Host "EXE не створив звіт: він не запускається" }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            Write-Host "::warning::EXE не пройшов самоперевірку: див. звіт вище. Не користуйтесь цим файлом і надішліть журнал розробнику."
            exit 1
          }

      - name: Check the icon inside the EXE
        shell: python
        continue-on-error: true
        run: |
          import subprocess, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          subprocess.run([sys.executable, "-m", "pip", "install", "pefile", "-q"], check=True)
          import pefile

          def icon_sizes(data):
              count = int.from_bytes(data[4:6], "little")
              return sorted({(data[6 + 14 * i] or 256) for i in range(count)})

          pe = pefile.PE("dist/Pomichnyk_Uchytelia.exe")
          found = []
          for kind in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              if kind.id == pefile.RESOURCE_TYPE["RT_GROUP_ICON"]:
                  for group in kind.directory.entries:
                      for lang in group.directory.entries:
                          found += icon_sizes(pe.get_data(lang.data.struct.OffsetToData, lang.data.struct.Size))
          found = sorted(set(found))
          if 256 in found and 24 in found:
              print("ICON CHECK: OK - логотип вбудовано в EXE, розміри:", found)
          else:
              print("ICON CHECK: УВАГА - у EXE стандартна іконка PyInstaller, розміри:", found)
              print("Перевірте, що в команді збірки є --icon \"app_icon.ico\" і файл app_icon.ico лежить у корені репозиторію.")

      - name: Save finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: Pomichnyk_Uchytelia_Windows_EXE
          path: dist/Pomichnyk_Uchytelia.exe
          if-no-files-found: error
